[package]
name = "keywarden-broker"
version = "0.2.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
flate2 = "1"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand_core = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "fs", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
